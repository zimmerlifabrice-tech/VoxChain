name: Build Windows VST3

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.10-${{ runner.os }}

      - name: Configure
        run: cmake -B build -A x64

      - name: Build plugin + tests
        run: cmake --build build --config Release --parallel --target VoxChain_VST3 VoxChainTests

      - name: Run DSP tests
        run: build\VoxChainTests_artefacts\Release\VoxChainTests.exe
        shell: cmd

      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --skip-gui-tests --validate-in-process --timeout-ms 600000 "build\VoxChain_artefacts\Release\VST3\VoxChain.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build\VoxChain_artefacts\Release\VST3\VoxChain.vst3" "dist\VoxChain.vst3"
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath VoxChain-Windows-VST3.zip -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: VoxChain-Windows-VST3
          path: VoxChain-Windows-VST3.zip

      - name: Publish release (only for version tags like v0.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VoxChain-Windows-VST3.zip
